aid: pomelo
url: https://raw.githubusercontent.com/api-evangelist/pomelo/refs/heads/main/apis.yml
name: Pomelo
kind: company
description: Pomelo (pomelo.la) is a Latin American card-issuing and embedded-finance
  platform. Its REST API lets fintechs and enterprises onboard users (KYC/KYB), issue
  physical and virtual cards, manage card accounts and balances, process and query
  transactions, move money with transfers and settlements, and authorize transactions
  in real time over a synchronous authorization webhook.
