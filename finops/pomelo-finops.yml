meters:
- name: cards_issued
  description: Physical and virtual cards issued, billed per card per program terms.
  unit: cards
  aggregation: sum
  dimensions:
  - program
  - card_type
- name: active_accounts
  description: Active card accounts under management, billed per account.
  unit: accounts
  aggregation: sum
  dimensions:
  - program
- name: transactions_processed
  description: Card transactions processed (purchases, withdrawals, refunds, reversals).
  unit: transactions
  aggregation: sum
  dimensions:
  - program
  - type
- name: authorizations
  description: Real-time authorization requests routed through the authorizer.
  unit: authorizations
  aggregation: sum
  dimensions:
  - program
- name: identity_verifications
  description: KYC / KYB identity verification sessions performed during onboarding.
  unit: verifications
  aggregation: sum
  dimensions:
  - program
  - kind
- name: transfers
  description: Fund transfers and settlements moved across card accounts.
  unit: transfers
  aggregation: sum
  dimensions:
  - program
- name: fx_volume
  description: Cross-border / FX transaction volume subject to currency-conversion fees.
  unit: currency
  aggregation: sum
  dimensions:
  - program
  - currency
principles:
- name: Visibility
  description: Reconcile Pomelo program invoices and the Transactions API; track per-card, per-account, and per-transaction cost drivers.
- name: Allocation
  description: Tag costs by program, affinity group, and card type; map interchange and processing fees to internal cost centers.
- name: Optimization
  description: Right-size physical vs virtual card mix, prune inactive accounts/cards, and minimize avoidable FX and reissuance costs.
- name: Accountability
  description: Assign program owners; review interchange share, processing fees, and KYC/KYB spend monthly against budget.
