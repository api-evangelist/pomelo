description: >-
  FinOps view of a Pomelo (pomelo.la) card-issuing program. Pomelo bills through
  negotiated, contract-based terms rather than public usage rates, so spend
  typically blends platform / program fees with per-card and per-account fees,
  transaction and authorization processing fees, interchange arrangements,
  KYC/KYB verification costs, FX, and BIN sponsorship. The meters below describe
  the cost drivers a program should track; specific rates are negotiated and not
  reconciled here.
notes: >-
  Pomelo does not publish unit rates; all amounts are program-specific. Verify
  cost drivers and rates against the signed agreement during reconciliation.
sources:
- https://www.pomelo.la
- https://developers.pomelo.la
- https://focus.finops.org/focus-specification/v1-3/
